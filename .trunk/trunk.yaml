version: 0.1

cli:
  version: 1.25.0

plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
    - id: configs
      ref: v1.2.1
      uri: https://github.com/trunk-io/configs

lint:
  enabled:
    - actionlint
    - black
    - clippy
    - eslint
    - golangci-lint
    - mypy
    - prettier
    - ruff
    - rustfmt
    - shellcheck
    - taplo
    - yamllint

actions:
  enabled:
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
