# cargo-deny configuration for phenotype-gfx
# https://embarkstududios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
vulnerability = 'deny'
unmaintained = 'warn'
yanked = 'warn'
notice = 'warn'

[licenses]
allow = ['MIT', 'Apache-2.0', 'BSD-2-Clause', 'BSD-3-Clause', 'ISC', 'Unicode-3.0', 'Unicode-DFS-2016', 'Zlib']
unlicensed = 'deny'

[bans]
multiple-versions = 'warn'
wildcards = 'allow'

[sources]
unknown-registry = 'deny'
unknown-git = 'deny'
