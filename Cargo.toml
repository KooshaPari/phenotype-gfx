[workspace]
resolver = "2"
members = [".", "crates/phenotype-voxel"]

[package]
name = "phenotype-gfx"
version = "0.2.0"
edition = "2021"
rust-version = "1.75.0"
description = "Unified graphics kernel: voxel, LOD, streaming, postfx, water, voxelizer, terrain. Single Rust core per ADR-004."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/KooshaPari/phenotype-gfx"
keywords = ["graphics", "voxel", "terrain", "water", "postfx"]
categories = ["game-engines", "graphics", "data-structures"]

[lib]
name = "phenotype_gfx"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# L5-109 (2026-06-18): voxel crate inlined into src/voxel/ — drop git dep, add direct deps.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = "1"
thiserror = "2"
# glam 0.29 for water/postfx math; 0.18+ broke Vec3 ABI relative to 0.27
glam = { version = "0.29", features = ["serde"] }
# L5-110 terrain uses UUID v4 ids for material registry keys.
uuid = { version = "1", features = ["v4", "serde"] }
# L5-obs (2026-06-30): structured tracing — zero-cost when no subscriber is wired.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
# metrics facade — no-op when no recorder is installed; consumers opt-in to prometheus/statsd.
metrics = { version = "0.24", default-features = false }

# OTLP + Prometheus observability (feature-gated)
opentelemetry = { version = "0.28", optional = true }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.28", features = ["grpc-tonic"], optional = true }
opentelemetry-prometheus = { version = "0.28", optional = true }
prometheus = { version = "0.13", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }

# Bevy adapter is optional — only pulled in when consumers need ECS integration
bevy = { version = "0.18.1", default-features = false, features = ["bevy_asset", "bevy_mesh"], optional = true }

# L5-110..112: ported C# terrain/water/postfx into Rust; criterion benches
criterion = { version = "0.5", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-test = "0.2"
anyhow = "1.0"

[[bench]]
name = "voxelizer_bench"
harness = false

[[bench]]
name = "mesher_compare"
harness = false

[[bench]]
name = "perf_suite"
harness = false

[[bench]]
name = "post_stack_bench"
harness = false

[[example]]
name = "consume_mesh"
path = "examples/consume_mesh.rs"

[[example]]
name = "terrain_demo"
path = "examples/terrain_demo.rs"

[[example]]
name = "water_demo"
path = "examples/water_demo.rs"

[[example]]
name = "postfx_demo"
path = "examples/postfx_demo.rs"

[[example]]
name = "full_scene"
path = "examples/full_scene.rs"

[[example]]
name = "networking_demo"
path = "examples/networking_demo.rs"

[[example]]
name = "ecs_integration"
path = "examples/ecs_integration.rs"

[features]
default = []
bevy = ["dep:bevy"]
# Enable criterion-backed benches in `cargo bench --features bench`
bench = ["dep:criterion"]
# OTLP + Prometheus observability stack
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tokio"]
prometheus = ["dep:opentelemetry-prometheus", "dep:prometheus"]
full-obs = ["otlp", "prometheus"]
# SIMD-accelerated voxel meshing (SSE2 on x86_64, scalar fallback elsewhere)
simd = []
