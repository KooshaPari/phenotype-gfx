version: '3'

vars:
  GREETING: Hello, World!

tasks:
  default:
    desc: Say hello
    cmds:
      - echo "{{.GREETING}}"

  build:
    desc: Build the workspace
    cmds:
      - cargo build --workspace
      - echo "Unity builds are handled via Unity Editor or CI pipeline."

  test:
    desc: Run all tests
    cmds:
      - cargo test --workspace
      - echo "Unity tests are run via Unity Test Runner in CI."

  lint:
    desc: Run linters and formatters
    cmds:
      - trunk check
      - cargo clippy --workspace -- -D warnings

  fmt:
    desc: Format code
    cmds:
      - trunk fmt
      - cargo fmt --all
