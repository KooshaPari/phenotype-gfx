#
# Phase 6.2 — Real Unity Editor shader-rendering test workflow.
#
# Runs the 7 phenotype-postfx passes (SSAO, SSGI, Bloom, ACES, Vignette,
# Chromatic, LUT) inside an actual Unity Editor via the
# unityci/editor:ubuntu-2022.3.20f1-focal-2 image. The container invokes
# `Unity -batchmode -runTests -testPlatform EditMode` and uploads the
# NUnit XML so PRs can see per-pass pass/fail counts.
#
# This workflow supplements (does NOT replace) the existing
# `unity-tests.yml` workflow which exercises the C# P/Invoke wrapper with
# the dotnet-stub harness — it validates the *shader* half of the postfx
# stack.

name: Unity PostFX Rendering Tests

on:
  push:
    branches: [main, master, develop]
    paths:
      - "unity/postfx/**"
      - "tests/unity-rendering/**"
      - ".github/workflows/unity-postfx-render.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "unity/postfx/**"
      - "tests/unity-rendering/**"
      - ".github/workflows/unity-postfx-render.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-postfx-render:
    name: Unity Editor shader-rendering tests (PostFx, 7 passes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1

      # ------------------------------------------------------------------
      # Run Unity EditMode tests inside the official unityci/editor image.
      # `unityci/editor:ubuntu-2022.3.20f1-focal-2` already contains the
      # Unity 2022.3.20f1 binary on Ubuntu 20.04 — matches the
      # ProjectVersion.txt we ship in tests/unity-rendering/.
      # ------------------------------------------------------------------
      - name: Run Unity EditMode tests (PostFx 7-pass shader validation)
        id: tests
        uses: game-ci/unity-test-runner@v4.0.0
        with:
          projectPath: tests/unity-rendering
          testMode: EditMode
          # `-nographics` is intentionally NOT passed: the unityci/editor
          # image provides an xvfb-managed virtual framebuffer, which is
          # required for `Graphics.Blit` to execute fragment shaders in
          # EditMode. The action sets up xvfb automatically.
          customParameters: -logFile -
          artifactsPath: tests/unity-rendering/artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarise pass/fail per PostFx effect
        if: always()
        run: |
          set -euo pipefail
          RESULTS="$(find tests/unity-rendering/artifacts -name '*.xml' | head -n 1 || true)"
          if [ -z "$RESULTS" ]; then
            echo "::warning::No NUnit results XML found."
            exit 0
          fi

          # Per-pass counts — keyed on the test method prefix
          # 'Pass_<Effect>_Renders_NonBlack_Frame'. A regression in any
          # single pass fails the job.
          PASSES=$(jq -r '
            .["test-run"] | .testsuite |
            map(select(.testcase // [] | map(.name) | any(startswith("Phenotype.PostFx.EditorTests.PostStackShaderRenderingTests.Pass_")))) |
            (map(.testcase // [] | map(select(.name | startswith("Phenotype.PostFx.EditorTests.PostStackShaderRenderingTests.Pass_"))) | .[]) | .name) as $names |
            ($names | map(split(".")[5])) as $effects |
            ($names | map(.result)) as $results |
            { effects: $effects, results: $results }
          ' "$RESULTS")

          echo "=== Per-pass shader rendering results ==="
          echo "$PASSES" | jq -r '
            (.effects // []) as $es |
            (.results // []) as $rs |
            range(0; ($es | length)) |
            "  Pass \($es[.]) = \($rs[.])"
          ' || true

          FAILED=$(jq -r '
            [.testsuite.testcase // [] | .[] |
             select(.name | startswith("Phenotype.PostFx.EditorTests.PostStackShaderRenderingTests.Pass_")) |
             select(.result != "Success" and .result != "Passed")] | length
          ' "$RESULTS")
          if [ "${FAILED:-0}" != "0" ]; then
            echo "::error::$FAILED PostFX pass(es) failed to render a non-degenerate frame."
            exit 1
          fi
          echo "All 7 PostFX passes rendered successfully."

      - name: Upload Unity log
        if: failure()
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b93bb68f97
        with:
          name: unity-postfx-render-log
          path: |
            tests/unity-rendering/artifacts/**/*.log
            tests/unity-rendering/artifacts/**/*.xml
          if-no-files-found: ignore
          retention-days: 7